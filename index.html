<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Ranking Gastronômico 🧀</title>
<style>
@font-face {
  font-family: 'Toystory';
  src: url('DnsToystory-Regular.woff2') format('woff2');
  font-weight: normal; font-style: normal;
}
@font-face {
  font-family: 'LetraArtista';
  src: url('LapisDeArtista-Regular.woff2') format('woff2');
  font-weight: normal; font-style: normal;
}
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F5F5F5;
    --bg2:       #EFEFEF;
    --bg3:       #E8E8E8;
    --border:    #BDB8A0;
    --border2:   #A8A38C;
    --yellow:    #FCEA96;
    --yellow2:   #EDD870;
    --btn:       #E0D49C;
    --btn2:      #CEC080;
    --ink:       #242430;
    --muted:     #6A6A78;
    --muted2:    #9A9AA8;
    --font:      'LetraArtista', 'Courier New', monospace;
    --font-title: 'Toystory', 'Courier New', monospace;
    --radius:    4px;
    --max:       480px;
  }

  html { background: var(--bg); }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    max-width: var(--max);
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ──────────────────────────────────────────── */
  header {
    background: var(--yellow);
    padding: 14px 20px 14px;
    border-bottom: 3px solid var(--border2);
    position: sticky; top: 0; z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    min-width: 0;
  }

  .header-eyebrow {
    font-family: var(--font);
    font-size: 10px; letter-spacing: .3em;
    text-transform: uppercase; color: var(--ink);
    margin-bottom: 2px;
  }
  .header-title {
    font-family: var(--font-title);
    font-size: 24px; line-height: 1.15;
    font-weight: 700; color: var(--ink);
    letter-spacing: -.01em;
  }
  .header-sub {
    font-size: 12px; color: var(--ink);
    margin-top: 4px; letter-spacing: .05em;
  }

  .header-image {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .header-image img {
    height: 72px;
    width: auto;
    object-fit: contain;
    display: block;
  }

  #saving-indicator {
    position: absolute; top: 10px; right: 18px;
    font-family: var(--font); font-size: 10px;
    letter-spacing: .12em; color: var(--ink);
    display: none;
  }
  #saving-indicator.show { display: block; }

  /* ── Nav ─────────────────────────────────────────────── */
  nav {
    display: flex; background: var(--ink);
    border-bottom: 2px solid var(--ink);
    position: sticky; top: 87px; z-index: 99;
  }
  nav button {
    flex: 1; padding: 12px 8px;
    background: transparent; border: none;
    font-family: var(--font-title); font-size: 17px;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--muted); cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all .15s;
  }
  nav button.active {
    color: var(--ink); background: var(--yellow2);
    border-bottom-color: var(--ink);
  }

  /* ── Setup banner ────────────────────────────────────── */
  #setup-banner {
    background: #FFFBE8;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px; margin: 16px;
    font-size: 13px; line-height: 1.6;
    color: var(--ink);
  }
  #setup-banner strong { color: var(--ink); }
  #url-input-wrap { display: flex; gap: 8px; margin-top: 10px; }
  #script-url-input {
    flex: 1; background: #fff;
    border: 2px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; color: var(--ink);
    font-family: var(--font); font-size: 12px;
    outline: none;
  }
  #save-url-btn {
    background: var(--ink); color: var(--yellow);
    border: none; border-radius: var(--radius);
    padding: 9px 14px; cursor: pointer;
    font-family: var(--font); font-weight: 700;
    font-size: 11px; letter-spacing: .12em; white-space: nowrap;
    text-transform: uppercase;
  }

  /* ── Views ───────────────────────────────────────────── */
  .view { display: none; padding: 0 0 80px; }
  .view.active { display: block; }

  /* ── Form ────────────────────────────────────────────── */
  .form-wrap { padding: 18px 16px; }
  .section-title {
    font-family: var(--font-title); font-size: 18px;
    font-weight: 700; margin-bottom: 18px; color: var(--ink);
    text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 2px solid var(--border); padding-bottom: 8px;
  }
  .form-group { margin-bottom: 16px; }
  label.field-label {
    display: block;
    font-family: var(--font); font-size: 10px;
    letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  label.field-label span.req { color: var(--ink); font-weight: 700; }
  input[type=text], select, textarea {
    width: 100%;
    background: #fff; border: 2px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    color: var(--ink); font-family: var(--font);
    font-size: 14px; outline: none;
    transition: border-color .15s;
  }
  input[type=text]:focus, select:focus, textarea:focus {
    border-color: var(--ink);
  }
  select { appearance: none; }
  textarea { min-height: 0; resize: none; }

  .stars-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .star-group { margin-bottom: 14px; }
  .star-group-label {
    font-family: var(--font); font-size: 13px;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px;
  }
  .stars { display: flex; gap: 3px; }
  .star {
    font-size: 57px; cursor: pointer;
    color: var(--border);
    transition: color .1s, transform .1s;
    line-height: 1; user-select: none;
  }
  .star.on  { color: #FADD00; }
  .star:hover { transform: scale(1.15); }

  .stars-grid {
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: var(--bg3);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .add-item-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-item-row input { flex: 1; font-size: 13px; padding: 8px 11px; }
  .add-item-row button {
    background: var(--bg3); border: 2px solid var(--border);
    border-radius: var(--radius); color: var(--ink);
    font-family: var(--font); font-size: 11px;
    letter-spacing: .1em; cursor: pointer;
    padding: 8px 12px; white-space: nowrap;
    text-transform: uppercase;
  }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--btn);
    color: var(--ink); border: 2px solid var(--border2);
    border-radius: var(--radius); cursor: pointer;
    font-family: var(--font-title); font-size: 13px;
    font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase;
    transition: opacity .2s;
  }
  .btn-primary:hover { background: var(--btn2); }
  .btn-primary:disabled { opacity: .4; cursor: default; }

  .form-error {
    color: #8B2020; font-size: 12px;
    margin-bottom: 12px; font-family: var(--font);
    background: #FFE8E8; border: 1px solid #D08080;
    border-radius: var(--radius); padding: 8px 12px;
  }
  .form-success {
    color: #1A4A2A; font-size: 13px;
    margin-bottom: 12px; font-family: var(--font);
    background: #E8F5EC; border: 2px solid #6AAA7A;
    border-radius: var(--radius); padding: 10px 14px;
  }

  /* ── Ranking view ────────────────────────────────────── */
  .ranking-wrap { padding: 14px 16px 0; }
  .filters-row {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filters-row select {
    flex: 1; min-width: 120px; font-size: 12px; padding: 8px 11px;
  }
  .filter-btn {
    background: var(--btn); color: var(--ink); border: 2px solid var(--border2);
    border: none; border-radius: var(--radius);
    padding: 9px 16px; cursor: pointer;
    font-family: var(--font); font-weight: 700;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  }

  .ranking-count {
    font-family: var(--font); font-size: 10px;
    letter-spacing: .25em; text-transform: uppercase;
    color: var(--muted2); margin-bottom: 12px;
  }

  .place-card {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .place-card:hover {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--border2);
  }

  .card-top {
    display: flex; align-items: center;
    gap: 12px; padding: 14px 16px 10px;
  }
  .rank-badge {
    width: 38px; height: 38px; border-radius: var(--radius);
    background: var(--bg3); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-weight: 700;
    font-size: 15px; color: var(--ink); flex-shrink: 0;
  }
  .rank-badge.gold {
    background: var(--yellow); border-color: var(--btn2);
    color: var(--ink);
  }
  .rank-badge.silver {
    background: var(--border); border-color: var(--border2); color: var(--ink);
  }
  .rank-badge.bronze {
    background: var(--bg3); border-color: var(--border); color: var(--muted);
  }

  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-family: var(--font-title); font-size: 16px; font-weight: 700;
    color: var(--ink); line-height: 1.2;
  }
  .card-item {
    font-family: var(--font); font-size: 10px;
    letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted2); margin-top: 3px;
  }
  .card-score { text-align: right; flex-shrink: 0; }
  .score-num {
    font-family: var(--font-title); font-size: 26px;
    font-weight: 700; color: var(--ink); line-height: 1;
  }
  .score-label {
    font-family: var(--font); font-size: 10px;
    letter-spacing: .1em; color: var(--muted2);
    text-transform: uppercase;
  }

  .card-bars { padding: 0 16px 14px; }
  .bar-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
  }
  .bar-name {
    font-family: var(--font); font-size: 9px;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted2); width: 80px; flex-shrink: 0; text-align: right;
  }
  .bar-track {
    flex: 1; height: 6px; background: var(--bg3);
    border-radius: 0; overflow: hidden;
    border: 1px solid var(--border);
  }
  .bar-fill {
    height: 100%;
    background: var(--btn2);
    transition: width .5s ease;
  }
  .bar-val {
    font-family: var(--font); font-size: 10px;
    color: var(--muted); width: 24px; text-align: right; flex-shrink: 0;
  }
  .card-footer {
    padding: 8px 16px 12px;
    border-top: 1px solid var(--bg3);
    display: flex; gap: 16px;
    font-family: var(--font); font-size: 10px;
    letter-spacing: .08em; color: var(--muted2);
    text-transform: uppercase;
  }

  .empty-state { text-align: center; padding: 60px 24px; color: var(--muted2); }
  .empty-icon { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--muted); font-family: var(--font-title); text-transform: uppercase; letter-spacing: .08em; }
  .empty-sub { font-size: 13px; font-family: var(--font); }

  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--btn2);
    animation: spin .8s linear infinite;
    margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 360px) {
    .card-name { font-size: 14px; }
    .score-num { font-size: 22px; }
    .header-image img { height: 56px; }
    .header-title { font-size: 20px; }
  }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────── -->
<header>
  <div class="header-left">
    <div class="header-eyebrow">Ranking Gastronômico</div>
    <div class="header-title">🧀 Guia de Sabores</div>
    <div class="header-sub">Avalie, compare e descubra os melhores</div>
  </div>
  <div class="header-image">
    <img src="GARFO top1.png" alt="Garfo"/>
  </div>
  <span id="saving-indicator">⏳ SALVANDO…</span>
</header>

<!-- ── NAV ────────────────────────────────────────── -->
<nav>
  <button class="active" data-view="ranking" onclick="switchView('ranking')">🏆 Ranking</button>
  <button data-view="form"    onclick="switchView('form')">＋ Avaliar</button>
</nav>

<!-- ── SETUP BANNER ───────────────────────────────── -->
<div id="setup-banner">
  <strong>⚙️ Configuração necessária</strong><br>
  Cole abaixo a URL do seu Apps Script publicado como Web App:
  <div id="url-input-wrap">
    <input type="text" id="script-url-input" placeholder="https://script.google.com/macros/s/…/exec"/>
    <button id="save-url-btn" onclick="saveScriptUrl()">Salvar</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     VIEW: RANKING
════════════════════════════════════════════════════ -->
<div id="view-ranking" class="view active">
  <div class="ranking-wrap">
    <div class="filters-row">
      <select id="filter-item" onchange="loadRanking()">
        <option value="">Todos os itens</option>
      </select>
      <select id="filter-lugar" onchange="loadRanking()">
        <option value="">Todos os lugares</option>
      </select>
    </div>
    <div id="ranking-count" class="ranking-count"></div>
    <div id="ranking-list"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════
     VIEW: FORMULÁRIO
════════════════════════════════════════════════════ -->
<div id="view-form" class="view">
  <div class="form-wrap">
    <div class="section-title">Nova Avaliação</div>

    <div class="form-group">
      <label class="field-label">Avaliador</label>
      <input type="text" id="f-avaliador" placeholder="Seu nome"/>
    </div>

    <div class="form-group">
      <label class="field-label">Nome do Lugar <span class="req">*</span></label>
      <input type="text" id="f-lugar" placeholder="Ex: Padaria Central"/>
    </div>

    <div class="form-group">
      <label class="field-label">Item <span class="req">*</span></label>
      <select id="f-item"></select>
      <div class="add-item-row">
        <input type="text" id="f-novo-item" placeholder="Adicionar novo item…"/>
        <button onclick="adicionarNovoItem()">+ Adicionar</button>
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">Notas de Avaliação <span class="req">*</span></label>
      <div class="stars-grid">
        <div class="star-group" id="sg-aroma">
          <div class="star-group-label">Aroma</div>
          <div class="stars" data-field="aroma"></div>
        </div>
        <div class="star-group" id="sg-textura">
          <div class="star-group-label">Textura</div>
          <div class="stars" data-field="textura"></div>
        </div>
        <div class="star-group" id="sg-sabor">
          <div class="star-group-label">Sabor</div>
          <div class="stars" data-field="sabor"></div>
        </div>
        <div class="star-group" id="sg-consistencia">
          <div class="star-group-label">Apresentação</div>
          <div class="stars" data-field="apresentacao"></div>
        </div>
        <div class="star-group" id="sg-extra">
          <div class="star-group-label">Extra (impressão geral)</div>
          <div class="stars" data-field="extra"></div>
        </div>
      </div>
    </div>

    <div id="form-error"   class="form-error"   style="display:none"></div>
    <div id="form-success" class="form-success"  style="display:none"></div>

    <button class="btn-primary" id="submit-btn" onclick="submitForm()">
      Salvar Avaliação
    </button>
  </div>
</div>

<script>
const STORAGE_KEY = "gastro_script_url";
let scriptUrl = localStorage.getItem(STORAGE_KEY) || "";
let ratings   = { aroma: 0, textura: 0, sabor: 0, apresentacao: 0, extra: 0 };
let itens     = [];
let rankingData = [];

document.addEventListener("DOMContentLoaded", () => {
  initSetupBanner();
  initStars();
  if (scriptUrl) {
    loadItens();
    loadRanking();
  }
});

function initSetupBanner() {
  const banner = document.getElementById("setup-banner");
  if (scriptUrl) {
    document.getElementById("script-url-input").value = scriptUrl;
    banner.style.display = "none";
  }
}

function saveScriptUrl() {
  const val = document.getElementById("script-url-input").value.trim();
  if (!val.startsWith("https://")) { alert("URL inválida."); return; }
  scriptUrl = val;
  localStorage.setItem(STORAGE_KEY, scriptUrl);
  document.getElementById("setup-banner").style.display = "none";
  loadItens();
  loadRanking();
}

function initStars() {
  document.querySelectorAll(".stars").forEach(container => {
    const field = container.dataset.field;
    for (let i = 1; i <= 5; i++) {
      const s = document.createElement("span");
      s.className = "star";
      s.textContent = "★";
      s.dataset.val = i;
      s.onclick = () => setRating(field, i);
      s.onmouseenter = () => previewRating(field, i);
      s.onmouseleave = () => previewRating(field, ratings[field]);
      container.appendChild(s);
    }
  });
}

function setRating(field, val) {
  ratings[field] = val;
  previewRating(field, val);
}

function previewRating(field, val) {
  const container = document.querySelector(`.stars[data-field="${field}"]`);
  container.querySelectorAll(".star").forEach((s, i) => {
    s.classList.toggle("on", i < val);
  });
}

function saving(on) {
  document.getElementById("saving-indicator").classList.toggle("show", on);
}

async function api(action, body = {}) {
  if (!scriptUrl) return null;
  saving(true);
  try {
    const res = await fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify({ action, ...body }),
    });
    return await res.json();
  } catch(e) {
    console.error(e);
    return { error: e.message };
  } finally {
    saving(false);
  }
}

async function loadItens() {
  const data = await api("getItens");
  if (!data || data.error) return;
  itens = data.itens || [];
  renderItensDropdown();
  renderFilterItem();
}

function renderItensDropdown() {
  const sel = document.getElementById("f-item");
  sel.innerHTML = itens.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join("");
}

function renderFilterItem() {
  const sel = document.getElementById("filter-item");
  sel.innerHTML = `<option value="">Todos os itens</option>` +
    itens.map(i => `<option value="${esc(i)}">${esc(i)}</option>`).join("");
}

async function adicionarNovoItem() {
  const input = document.getElementById("f-novo-item");
  const item  = input.value.trim();
  if (!item) return;
  const data = await api("addItem", { item });
  if (!data || data.error) { alert("Erro ao adicionar item."); return; }
  input.value = "";
  if (!itens.includes(item)) itens.push(item);
  renderItensDropdown();
  renderFilterItem();
  document.getElementById("f-item").value = item;
}

async function loadRanking() {
  const list = document.getElementById("ranking-list");
  list.innerHTML = `<div class="spinner"></div>`;

  const filtroItem  = document.getElementById("filter-item").value;
  const filtroLugar = document.getElementById("filter-lugar").value;

  const data = await api("getRanking", { item: filtroItem, lugar: filtroLugar });

  if (!data) { list.innerHTML = renderEmpty("⚙️", "Configure o script acima", ""); return; }
  if (data.error) { list.innerHTML = renderEmpty("❌", "Erro ao carregar", data.error); return; }

  rankingData = data.ranking || [];
  renderRanking(rankingData);
  updateLugarFilter(rankingData);
}

function renderRanking(rows) {
  const list  = document.getElementById("ranking-list");
  const count = document.getElementById("ranking-count");
  count.textContent = `${rows.length} resultado${rows.length !== 1 ? "s" : ""}`;

  if (rows.length === 0) {
    list.innerHTML = renderEmpty("🫙", "Nenhuma avaliação ainda", "Seja o primeiro a avaliar!");
    return;
  }

  const medals = ["gold","silver","bronze"];
  list.innerHTML = rows.map((r, i) => `
    <div class="place-card">
      <div class="card-top">
        <div class="rank-badge ${medals[i] || ""}">
          ${i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1}
        </div>
        <div class="card-info">
          <div class="card-name">${esc(r.lugar)}</div>
          <div class="card-item">${esc(r.item)}</div>
        </div>
        <div class="card-score">
          <div class="score-num">${r.media.toFixed(1)}</div>
          <div class="score-label">/ 5</div>
        </div>
      </div>
      <div class="card-bars">
        ${barRow("Aroma", r.aroma)}
        ${barRow("Textura", r.textura)}
        ${barRow("Sabor", r.sabor)}
        ${barRow("Apresentação", r.apresentacao)}
        ${barRow("Extra", r.extra)}
      </div>
      <div class="card-footer">
        <span>📝 ${r.contagem} avaliação${r.contagem !== 1 ? "ões" : ""}</span>
      </div>
    </div>
  `).join("");
}

function barRow(label, val) {
  const pct = (val / 5 * 100).toFixed(0);
  return `
    <div class="bar-row">
      <span class="bar-name">${label}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-val">${val.toFixed(1)}</span>
    </div>`;
}

function updateLugarFilter(rows) {
  const lugares = [...new Set(rows.map(r => r.lugar))].sort();
  const sel = document.getElementById("filter-lugar");
  const cur = sel.value;
  sel.innerHTML = `<option value="">Todos os lugares</option>` +
    lugares.map(l => `<option value="${esc(l)}" ${l === cur ? "selected" : ""}>${esc(l)}</option>`).join("");
}

async function submitForm() {
  hideMessages();
  const avaliador = document.getElementById("f-avaliador").value.trim();
  const lugar     = document.getElementById("f-lugar").value.trim();
  const item      = document.getElementById("f-item").value;

  if (!lugar)     { showError("Informe o nome do lugar."); return; }
  if (!item)      { showError("Selecione um item."); return; }

  const fields = ["aroma","textura","sabor","apresentacao","extra"];
  for (const f of fields) {
    if (!ratings[f]) { showError(`Dê uma nota para ${f}.`); return; }
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;

  const data = await api("addAvaliacao", { avaliador, lugar, item, ...ratings });

  btn.disabled = false;
  if (!data || data.error) { showError("Erro ao salvar: " + (data && data.error)); return; }

  showSuccess(`✅ Avaliação salva! Média: ${Number(data.media).toFixed(1)} ⭐`);
  resetForm();
  loadRanking();
}

function resetForm() {
  document.getElementById("f-avaliador").value = "";
  document.getElementById("f-lugar").value = "";
  ratings = { aroma: 0, textura: 0, sabor: 0, apresentacao: 0, extra: 0 };
  Object.keys(ratings).forEach(f => previewRating(f, 0));
}

function switchView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");
  document.querySelector(`nav button[data-view="${name}"]`).classList.add("active");
  if (name === "ranking") loadRanking();
}

function esc(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function showError(msg) {
  const el = document.getElementById("form-error");
  el.textContent = "⚠ " + msg; el.style.display = "block";
}
function showSuccess(msg) {
  const el = document.getElementById("form-success");
  el.textContent = msg; el.style.display = "block";
}
function hideMessages() {
  document.getElementById("form-error").style.display = "none";
  document.getElementById("form-success").style.display = "none";
}
function renderEmpty(icon, title, sub) {
  return `<div class="empty-state">
    <span class="empty-icon">${icon}</span>
    <div class="empty-title">${title}</div>
    <div class="empty-sub">${sub}</div>
  </div>`;
}
</script>
</body>
</html>
